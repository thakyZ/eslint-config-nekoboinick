name: ci

on:
  workflow_call:
  push:
    tags-ignore:
      - v*.*.*
    paths-ignore:
      - .github/**
      - README.md
      - LICENSE
      - .gitattributes
      - .gitignore
      - .vscode/**
  pull_request:
    paths-ignore:
      - .github/**
      - README.md
      - LICENSE
      - .gitattributes
      - .gitignore
      - .vscode/**

permissions:
  contents: read

jobs:
  ci:
    name: Test with Node.JS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm install
      - name: Run CI tests
        run: npm run test:ci
